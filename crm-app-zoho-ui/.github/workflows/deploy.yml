name: Deploy CRM to GitHub Pages

on:
  push:
    branches:
      - Home/Workqueue-Dashboards-Messages-Leads
      - main
      - master
      - CRM
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-app-zoho-ui/crm-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crm-app-zoho-ui/crm-app/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production bundle
        run: npm run build

      - name: Ensure 404.html fallback exists for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crm-app-zoho-ui/crm-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

